<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ToDo Website</title>

</head>

<body>

  <!-- Flexbox -->
  <header class="navbar">
    <h1>My To-Do</h1>
    <nav>
      <a href="#todo">Tasks</a>
      <a href="#contact">Contact</a>
      <a href="#details">Add Task</a>
    </nav>
  </header>

  <!-- CSS Grid -->
  <main class="content-grid">
    <section id="todo" class="todo-app">
      <h2>To-Do List</h2>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Add a task" required />
        <button type="submit">Add</button>
      </form>
      <ul id="todo-list"></ul>
    </section>

    <section id="details" class="contact-form">
      <h2>Add Task with Details</h2>
      <form id="details-form" novalidate>
        <input type="text" id="task-name" placeholder="Task name" required />
        <span class="error" id="task-name-error"></span>

        <input type="date" id="task-due" required />
        <span class="error" id="task-due-error"></span>

        <textarea id="task-notes" placeholder="Notes (optional)"></textarea>

        <button type="submit">Save Task</button>
        <p id="form-success" class="success"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
